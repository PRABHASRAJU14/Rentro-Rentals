<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo-badge.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List New Vehicle - Rentro Rentals</title>
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/booking.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  
  <script src="../scripts/utils.js" defer></script>
  <script src="../scripts/storage.js" defer></script>
  <script src="../scripts/auth.js" defer></script>
  <script src="../scripts/vehicles.js" defer></script>
  <script src="../scripts/validation.js" defer></script>
</head>
<body>

  <header class="rentro-navbar">
    <div class="container navbar-inner">
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-icon"><img src="../images/logo.png" alt="Rentro Rentals Logo" class="brand-logo-img" /></div>
        <span>Rentro<span class="brand-accent">Fleet</span></span>
      </a>

      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">&larr; Back to Dashboard</a>
        <div id="nav-user-container"></div>
      </div>
    </div>
  </header>

  <main class="checkout-step-container">
    <div class="container container-narrow">
      <div class="checkout-card" style="max-width: 760px; margin: 0 auto;">
        
        <div class="checkout-header">
          <div>
            <h1>List a New Vehicle</h1>
            <p style="color:var(--text-muted); font-size:0.9rem;">Add a scooter or motorcycle to your fleet and start earning daily rentals</p>
          </div>
          <span class="badge badge-success">Instant Verification</span>
        </div>

        <form id="addVehicleForm" novalidate>
          <!-- Section 1: Basic Identifiers -->
          <h3 style="font-size:1.15rem; font-weight:700; margin-bottom:16px;">Vehicle Overview</h3>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehName">Listing Title</label>
              <input type="text" id="vehName" class="form-control" placeholder="e.g. Honda Activa 6G BS6" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehCategory">Category</label>
              <select id="vehCategory" class="form-control" required>
                <option value="Scooter">Daily Scooter</option>
                <option value="Sports Bike">Sports Bike</option>
                <option value="Cruiser">Cruiser Motorcycle</option>
                <option value="Electric Scooter">Electric Scooter</option>
              </select>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehBrand">Brand / Manufacturer</label>
              <input type="text" id="vehBrand" class="form-control" placeholder="e.g. Honda, Bajaj, TVS" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehModel">Model &amp; Edition</label>
              <input type="text" id="vehModel" class="form-control" placeholder="e.g. Smart Key Edition" />
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehRegNumber">Vehicle Registration Number</label>
              <input type="text" id="vehRegNumber" class="form-control" placeholder="e.g. AP 39 BK 4521" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehCity">Operating City</label>
              <select id="vehCity" class="form-control" required>
                <option value="Visakhapatnam">Visakhapatnam</option>
                <option value="Vijayawada">Vijayawada</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Chennai">Chennai</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi NCR">Delhi NCR</option>
                <option value="Pune">Pune</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="vehLocation">Exact Pickup Hub Location</label>
            <input type="text" id="vehLocation" class="form-control" placeholder="e.g. Siripuram Junction, Near Tech Park" required />
          </div>

          <!-- Section 2: Pricing & Deposit -->
          <h3 style="font-size:1.15rem; font-weight:700; margin:24px 0 16px;">Pricing &amp; Rates (₹)</h3>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehPriceDay">Price Per Day (₹)</label>
              <input type="number" id="vehPriceDay" class="form-control" placeholder="420" min="100" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehPriceHour">Price Per Hour (₹)</label>
              <input type="number" id="vehPriceHour" class="form-control" placeholder="45" min="20" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehDeposit">Refundable Deposit (₹)</label>
              <input type="number" id="vehDeposit" class="form-control" placeholder="500" min="0" value="500" required />
            </div>
          </div>

          <!-- Section 3: Technical Specifications -->
          <h3 style="font-size:1.15rem; font-weight:700; margin:24px 0 16px;">Technical Specifications</h3>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehFuel">Fuel Type</label>
              <select id="vehFuel" class="form-control">
                <option value="Petrol">Petrol</option>
                <option value="Electric">Electric</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="vehTransmission">Transmission</label>
              <select id="vehTransmission" class="form-control">
                <option value="Automatic">Automatic (Gearless)</option>
                <option value="Manual">Manual (Geared)</option>
              </select>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="vehMileage">Mileage / Battery Range</label>
              <input type="text" id="vehMileage" class="form-control" placeholder="e.g. 48 km/l or 110 km/charge" />
            </div>

            <div class="form-group">
              <label class="form-label" for="vehSeating">Seating Capacity</label>
              <select id="vehSeating" class="form-control">
                <option value="2">2 Persons</option>
                <option value="1">1 Person</option>
              </select>
            </div>
          </div>

          <!-- Section 4: Imagery & Description -->
          <h3 style="font-size:1.15rem; font-weight:700; margin:24px 0 16px;">Images &amp; Listing Description</h3>

          <div class="form-group">
            <label class="form-label" for="vehPresetImage">Choose Vehicle Asset Image</label>
            <select id="vehPresetImage" class="form-control">
              <option value="images/honda activa 6g.png">Honda Activa 6G</option>
              <option value="images/bajaj pulsar ns 400.png">Bajaj Pulsar NS 400</option>
              <option value="images/suzuki access 125(BS6).png">Suzuki Access 125</option>
              <option value="images/tvs jupiter.png">TVS Jupiter</option>
              <option value="images/honda dio 125.png">Honda Dio 125</option>
              <option value="images/royal enfield classic 350.png">Royal Enfield Classic</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="vehCustomImage">Or Custom Image URL (Optional)</label>
            <input type="url" id="vehCustomImage" class="form-control" placeholder="https://..." />
          </div>

          <div class="form-group">
            <label class="form-label" for="vehDesc">Detailed Description</label>
            <textarea id="vehDesc" class="form-control" rows="4" placeholder="Mention servicing history, condition, included helmets, or instructions for the renter."></textarea>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:32px;">
            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary btn-lg">Publish Listing to Marketplace &rarr;</button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RentroStorage.init();
      const hasAuth = RentroAuth.requireAuth('provider');
      if (!hasAuth) return;

      const provider = RentroAuth.getCurrentUser();
      if (provider.city) {
        document.getElementById('vehCity').value = provider.city;
      }

      document.getElementById('addVehicleForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('vehName').value.trim();
        const category = document.getElementById('vehCategory').value;
        const brand = document.getElementById('vehBrand').value.trim();
        const model = document.getElementById('vehModel').value.trim();
        const regNumber = document.getElementById('vehRegNumber').value.trim();
        const city = document.getElementById('vehCity').value;
        const location = document.getElementById('vehLocation').value.trim();
        const pricePerDay = Number(document.getElementById('vehPriceDay').value);
        const pricePerHour = Number(document.getElementById('vehPriceHour').value);
        const securityDeposit = Number(document.getElementById('vehDeposit').value) || 500;
        const fuelType = document.getElementById('vehFuel').value;
        const transmission = document.getElementById('vehTransmission').value;
        const mileage = document.getElementById('vehMileage').value.trim() || '45 km/l';
        const seatingCapacity = Number(document.getElementById('vehSeating').value) || 2;
        const presetImg = document.getElementById('vehPresetImage').value;
        const customImg = document.getElementById('vehCustomImage').value.trim();
        const description = document.getElementById('vehDesc').value.trim() || 'Pristine condition, freshly serviced with helmet included.';

        if (!name || !brand || !regNumber || !location || !pricePerDay || !pricePerHour) {
          RentroUtils.showToast('Please fill all mandatory fields.', 'error');
          return;
        }

        const newVehicle = RentroVehicles.add({
          providerId: provider.id,
          name, category, brand, model, regNumber, city, location,
          pricePerDay, pricePerHour, securityDeposit,
          fuelType, transmission, mileage, seatingCapacity,
          description,
          available: true,
          images: [customImg || presetImg]
        });

        RentroUtils.showToast(`Vehicle "${newVehicle.name}" published successfully!`, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 700);
      });
    });
  </script>
</body>
</html>
