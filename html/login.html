<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Rentro Rentals</title>
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/auth.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  
  <script src="../scripts/utils.js" defer></script>
  <script src="../scripts/storage.js" defer></script>
  <script src="../scripts/auth.js" defer></script>
  <script src="../scripts/validation.js" defer></script>
</head>
<body>

  <header class="rentro-navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="5" cy="18" r="3"></circle><circle cx="19" cy="18" r="3"></circle><path d="M12 18V8a2 2 0 0 1 2-2h4"></path><polyline points="15 3 18 6 15 9"></polyline><path d="M5 18h14"></path></svg>
        </div>
        <span>Rentro<span class="brand-accent">Rentals</span></span>
      </a>

      <div style="font-size:0.9rem;">
        Don't have an account? <a href="signup.html" style="color:var(--primary-hover); font-weight:700;">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to manage your rides or fleet dashboard</p>
      </div>

      <!-- Role Selector Toggle -->
      <div class="role-switch-container">
        <button type="button" class="role-tab-btn active" id="consumerRoleTab" data-role="consumer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Customer
        </button>
        <button type="button" class="role-tab-btn" id="providerRoleTab" data-role="provider">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          Fleet Provider
        </button>
      </div>

      <!-- Quick Demo Login Presets -->
      <div style="display:flex; gap:8px; margin-bottom:20px;">
        <button type="button" class="btn btn-outline-primary btn-sm" id="quickCustomerLoginBtn" style="flex:1;">
          👤 Demo Customer
        </button>
        <button type="button" class="btn btn-outline-primary btn-sm" id="quickProviderLoginBtn" style="flex:1;">
          🏢 Demo Host
        </button>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" for="loginPassword">Password</label>
            <span style="font-size:0.75rem; color:var(--text-muted);">Demo: password123</span>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:12px;">
          Sign In &rarr;
        </button>
      </form>

      <div class="auth-disclaimer">
        ℹ️ <strong>Frontend Simulation:</strong> Authentication is stored locally in your browser session for demo and portfolio testing.
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RentroStorage.init();

      let activeRole = 'consumer';
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('role') === 'provider') {
        activeRole = 'provider';
      }

      const consumerTab = document.getElementById('consumerRoleTab');
      const providerTab = document.getElementById('providerRoleTab');

      function setRole(role) {
        activeRole = role;
        consumerTab.classList.toggle('active', role === 'consumer');
        providerTab.classList.toggle('active', role === 'provider');
      }

      consumerTab.addEventListener('click', () => setRole('consumer'));
      providerTab.addEventListener('click', () => setRole('provider'));
      setRole(activeRole);

      // Password visibility toggle
      const passInput = document.getElementById('loginPassword');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      toggleBtn.addEventListener('click', () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
      });

      // Quick Demo Buttons
      document.getElementById('quickCustomerLoginBtn').addEventListener('click', () => {
        setRole('consumer');
        document.getElementById('loginEmail').value = 'rahul@example.com';
        document.getElementById('loginPassword').value = 'password123';
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      });

      document.getElementById('quickProviderLoginBtn').addEventListener('click', () => {
        setRole('provider');
        document.getElementById('loginEmail').value = 'provider@example.com';
        document.getElementById('loginPassword').value = 'password123';
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      });

      // Handle Login Submit
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if (!RentroValidator.isValidEmail(email)) {
          RentroUtils.showToast('Please enter a valid email address.', 'error');
          return;
        }
        if (!password) {
          RentroUtils.showToast('Please enter your password.', 'error');
          return;
        }

        const result = RentroAuth.login(email, password, activeRole);
        if (result.success) {
          RentroUtils.showToast(`Signed in as ${result.user.name}!`, 'success');
          
          const redirect = urlParams.get('redirect');
          setTimeout(() => {
            if (redirect) {
              window.location.href = decodeURIComponent(redirect);
            } else if (result.user.role === 'provider') {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = '../index.html';
            }
          }, 600);
        } else {
          RentroUtils.showToast(result.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
