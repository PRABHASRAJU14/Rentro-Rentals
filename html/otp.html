<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo-badge.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter OTP - Rentro Rentals</title>
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/booking.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  
  <script src="../scripts/utils.js" defer></script>
  <script src="../scripts/storage.js" defer></script>
  <script src="../scripts/auth.js" defer></script>
  <script src="../scripts/vehicles.js" defer></script>
  <script src="../scripts/bookings.js" defer></script>
  <script src="../scripts/payments.js" defer></script>
</head>
<body>

  <header class="rentro-navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon"><img src="../images/logo.png" alt="Rentro Rentals Logo" class="brand-logo-img" /></div>
        <span>Rentro<span class="brand-accent">Rentals</span></span>
      </a>
      <div style="font-size:0.9rem; font-weight:700; color:var(--text-secondary);">
        Two-Factor Authentication
      </div>
    </div>
  </header>

  <main class="checkout-step-container">
    <div class="container">
      <div class="checkout-card otp-box-container">
        
        <!-- Demonstration OTP Banner -->
        <div class="demo-otp-banner">
          <span>Demo 3D-Secure Code (Auto-Generated):</span>
          <strong id="demoOtpDisplay">------</strong>
          <button type="button" class="btn btn-outline-primary btn-sm" id="autoFillOtpBtn" style="margin-top:8px; background:#fff;">
            Auto-Fill OTP
          </button>
        </div>

        <h1 style="font-size:1.6rem; font-weight:800; color:var(--secondary); margin-bottom:8px;">
          Authenticate Transaction
        </h1>
        <p style="color:var(--text-secondary); font-size:0.92rem;">
          Enter the 6-digit verification code sent to your registered mobile number <strong id="maskedPhone">+91 ******3210</strong>
        </p>

        <!-- 6 Digit OTP Inputs -->
        <form id="otpVerifyForm">
          <div class="otp-inputs-row">
            <input type="text" class="otp-digit-input" maxlength="1" data-index="0" autofocus />
            <input type="text" class="otp-digit-input" maxlength="1" data-index="1" />
            <input type="text" class="otp-digit-input" maxlength="1" data-index="2" />
            <input type="text" class="otp-digit-input" maxlength="1" data-index="3" />
            <input type="text" class="otp-digit-input" maxlength="1" data-index="4" />
            <input type="text" class="otp-digit-input" maxlength="1" data-index="5" />
          </div>

          <div id="otpErrorMsg" style="display:none; color:var(--danger); font-size:0.88rem; font-weight:600; margin-bottom:16px;">
            Invalid OTP code. Please enter the demo code shown above.
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="submitOtpBtn" style="width:100%; margin-bottom:18px;">
            Authorize & Confirm Booking
          </button>

          <!-- Resend with Timer -->
          <div style="font-size:0.88rem; color:var(--text-muted);">
            Didn't receive code? 
            <button type="button" id="resendOtpBtn" style="background:none; border:none; color:var(--primary-hover); font-weight:700; cursor:pointer;" disabled>
              Resend in <span id="cooldownTimer">30</span>s
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RentroStorage.init();

      const draft = RentroPayments.getCheckoutDraft();
      if (!draft) {
        RentroUtils.showToast('No booking in progress. Returning to search...', 'warning');
        setTimeout(() => window.location.href = 'search.html', 1000);
        return;
      }

      // Display masked phone
      const phone = draft.customerPhone || '9876543210';
      document.getElementById('maskedPhone').textContent = `+91 ******${phone.slice(-4)}`;

      // Display or Generate OTP
      let currentOtp = RentroPayments.getCurrentOTP();
      if (!currentOtp) {
        currentOtp = RentroPayments.generateOTP();
      }
      document.getElementById('demoOtpDisplay').textContent = currentOtp;

      // Handle 6 Input Fields Auto-advancement
      const inputs = document.querySelectorAll('.otp-digit-input');

      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = val;

          if (val && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Handle Paste
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
          if (pasteData) {
            for (let i = 0; i < Math.min(pasteData.length, inputs.length); i++) {
              inputs[i].value = pasteData[i];
            }
            const nextIdx = Math.min(pasteData.length, inputs.length - 1);
            inputs[nextIdx].focus();
          }
        });
      });

      // Auto-Fill Button
      document.getElementById('autoFillOtpBtn').addEventListener('click', () => {
        const otpStr = RentroPayments.getCurrentOTP() || '';
        for (let i = 0; i < Math.min(otpStr.length, inputs.length); i++) {
          inputs[i].value = otpStr[i];
        }
        inputs[inputs.length - 1].focus();
      });

      // Resend Cooldown Timer
      let cooldown = 30;
      const resendBtn = document.getElementById('resendOtpBtn');
      const timerSpan = document.getElementById('cooldownTimer');

      const interval = setInterval(() => {
        cooldown--;
        if (cooldown <= 0) {
          clearInterval(interval);
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend OTP Now';
        } else {
          timerSpan.textContent = cooldown;
        }
      }, 1000);

      resendBtn.addEventListener('click', () => {
        const newOtp = RentroPayments.generateOTP();
        document.getElementById('demoOtpDisplay').textContent = newOtp;
        RentroUtils.showToast(`New demo OTP sent: ${newOtp}`, 'info');
        resendBtn.disabled = true;
        cooldown = 30;
        resendBtn.innerHTML = `Resend in <span id="cooldownTimer">30</span>s`;
      });

      // Form Submission & Verification
      const otpForm = document.getElementById('otpVerifyForm');
      const errorMsg = document.getElementById('otpErrorMsg');

      otpForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const enteredOtp = Array.from(inputs).map(i => i.value).join('');

        if (enteredOtp.length < 6) {
          errorMsg.style.display = 'block';
          errorMsg.textContent = 'Please enter all 6 digits of the OTP code.';
          return;
        }

        const verifyResult = RentroPayments.verifyOTP(enteredOtp);
        if (verifyResult.success) {
          errorMsg.style.display = 'none';
          
          // Commit booking to database
          const finalResult = RentroPayments.processFinalPayment(draft.paymentMethod || 'Online Payment');

          if (finalResult.success) {
            RentroUtils.showToast('Payment verified successfully! Generating receipt...', 'success');
            setTimeout(() => window.location.href = 'success.html', 600);
          } else {
            errorMsg.style.display = 'block';
            errorMsg.textContent = finalResult.message;
          }
        } else {
          errorMsg.style.display = 'block';
          errorMsg.textContent = verifyResult.message;
        }
      });
    });
  </script>
</body>
</html>
