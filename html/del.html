<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo-badge.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Fleet Vehicles - Rentro Rentals</title>
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  
  <script src="../scripts/utils.js" defer></script>
  <script src="../scripts/storage.js" defer></script>
  <script src="../scripts/auth.js" defer></script>
  <script src="../scripts/vehicles.js" defer></script>
  <script src="../scripts/bookings.js" defer></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="rentro-navbar">
    <div class="container navbar-inner" style="max-width: 100%; padding: 0 32px;">
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-icon"><img src="../images/logo.png" alt="Rentro Rentals Logo" class="brand-logo-img" /></div>
        <span>Rentro<span class="brand-accent">Fleet</span></span>
      </a>

      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">&larr; Dashboard</a>
        <a href="create.html" class="btn btn-primary btn-sm">+ List Vehicle</a>
        <div id="nav-user-container"></div>
      </div>
    </div>
  </header>

  <main style="padding: 40px 32px; background: var(--bg-page); min-height: calc(100vh - 72px);">
    <div class="container" style="max-width: 1200px;">
      
      <div class="dashboard-topbar">
        <div>
          <h1 style="font-size:2rem; font-weight:800; color:var(--secondary);">Manage Vehicle Fleet</h1>
          <p style="color:var(--text-muted); font-size:0.95rem;">Update pricing, edit specs, toggle availability, or remove listings from the marketplace</p>
        </div>

        <div style="display:flex; gap:12px; align-items:center;">
          <input type="text" id="fleetSearchInput" class="form-control" placeholder="Search by model or reg number..." style="width: 280px;" />
          <a href="create.html" class="btn btn-primary">+ Add New</a>
        </div>
      </div>

      <!-- Fleet Grid / Table Card -->
      <div class="panel-card">
        <div class="data-table-wrapper">
          <table class="rentro-table">
            <thead>
              <tr>
                <th>Vehicle Details</th>
                <th>Category</th>
                <th>Location</th>
                <th>Daily / Hourly Price</th>
                <th>Status</th>
                <th>Bookings Count</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="manageFleetTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Edit Vehicle Modal -->
  <div class="rentro-modal-backdrop" id="editVehicleModal" style="display:none;">
    <div class="rentro-modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3>Edit Vehicle Listing</h3>
        <button class="modal-close-btn" id="closeEditModalBtn">&times;</button>
      </div>

      <form id="editVehicleForm">
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
          <input type="hidden" id="editVehId" />

          <div class="form-group">
            <label class="form-label" for="editVehName">Vehicle Name</label>
            <input type="text" id="editVehName" class="form-control" required />
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="editVehPriceDay">Price Per Day (₹)</label>
              <input type="number" id="editVehPriceDay" class="form-control" min="50" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="editVehPriceHour">Price Per Hour (₹)</label>
              <input type="number" id="editVehPriceHour" class="form-control" min="10" required />
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label" for="editVehDeposit">Deposit (₹)</label>
              <input type="number" id="editVehDeposit" class="form-control" min="0" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="editVehMileage">Mileage</label>
              <input type="text" id="editVehMileage" class="form-control" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="editVehLocation">Pickup Hub Address</label>
            <input type="text" id="editVehLocation" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="editVehDesc">Description</label>
            <textarea id="editVehDesc" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RentroStorage.init();
      const hasAuth = RentroAuth.requireAuth('provider');
      if (!hasAuth) return;

      const provider = RentroAuth.getCurrentUser();
      const tableBody = document.getElementById('manageFleetTableBody');
      const searchInput = document.getElementById('fleetSearchInput');
      const editModal = document.getElementById('editVehicleModal');
      const closeEditBtn = document.getElementById('closeEditModalBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      const editForm = document.getElementById('editVehicleForm');

      function loadFleet(searchQuery = '') {
        const vehicles = RentroVehicles.getByProvider(provider.id);
        const allBookings = RentroBookings.getAll();

        const filtered = vehicles.filter(v => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return v.name.toLowerCase().includes(q) || v.regNumber.toLowerCase().includes(q) || v.city.toLowerCase().includes(q);
        });

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="7" class="table-empty-state-cell">
                <div class="dashboard-empty-state">
                  <div class="dashboard-empty-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </div>
                  <h4>No Vehicles Found</h4>
                  <p>No listings matched "${searchQuery || 'your fleet'}". Try a different keyword or add a new vehicle.</p>
                  <a href="create.html" class="btn btn-primary btn-sm">+ List New Vehicle</a>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = filtered.map(v => {
          const bookingCount = allBookings.filter(b => b.vehicleId === v.id).length;
          return `
            <tr>
              <td>
                <div class="table-vehicle-cell">
                  <img src="${RentroUtils.resolvePath(v.images[0] || 'images/honda activa 6g.png')}" alt="${v.name}" class="table-vehicle-thumb" />
                  <div>
                    <strong>${v.name}</strong>
                    <div style="font-size:0.75rem; color:var(--text-muted);">${v.regNumber} &bull; ${v.brand}</div>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-info">${v.category}</span></td>
              <td>${v.location}<br><small style="color:var(--text-muted);">${v.city}</small></td>
              <td>
                <strong>${RentroUtils.formatCurrency(v.pricePerDay)}</strong> / day<br>
                <small style="color:var(--text-muted);">${RentroUtils.formatCurrency(v.pricePerHour)} / hr</small>
              </td>
              <td>
                <button class="btn btn-sm ${v.available ? 'btn-outline-primary' : 'btn-ghost'}" onclick="toggleAvailability('${v.id}')">
                  ${v.available ? '🟢 Online' : '⚪ Offline'}
                </button>
              </td>
              <td><strong>${bookingCount}</strong> total bookings</td>
              <td>
                <div class="action-btn-group">
                  <button class="btn btn-sm btn-ghost" onclick="openEditModal('${v.id}')" title="Edit Vehicle Details">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  </button>
                  <button class="btn btn-sm btn-ghost text-danger" onclick="deleteVehicleListing('${v.id}', '${v.name.replace(/'/g, "\\'")}')" title="Delete Listing">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      // Search event
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          loadFleet(e.target.value.trim());
        });
      }

      window.toggleAvailability = (id) => {
        RentroVehicles.toggleStatus(id);
        RentroUtils.showToast('Availability status updated.', 'info');
        loadFleet(searchInput.value.trim());
      };

      window.deleteVehicleListing = async (id, name) => {
        const confirmed = await RentroUtils.confirmModal({
          title: 'Confirm Delete Listing',
          message: `Are you sure you want to remove "${name}" from your rental inventory? Active and completed booking history will be preserved.`,
          confirmText: 'Delete Vehicle',
          type: 'danger'
        });

        if (confirmed) {
          RentroVehicles.delete(id);
          RentroUtils.showToast(`Vehicle "${name}" removed.`, 'success');
          loadFleet(searchInput.value.trim());
        }
      };

      window.openEditModal = (id) => {
        const v = RentroVehicles.getById(id);
        if (!v) return;

        document.getElementById('editVehId').value = v.id;
        document.getElementById('editVehName').value = v.name;
        document.getElementById('editVehPriceDay').value = v.pricePerDay;
        document.getElementById('editVehPriceHour').value = v.pricePerHour;
        document.getElementById('editVehDeposit').value = v.securityDeposit || 500;
        document.getElementById('editVehMileage').value = v.mileage || '';
        document.getElementById('editVehLocation').value = v.location;
        document.getElementById('editVehDesc').value = v.description || '';

        editModal.style.display = 'flex';
      };

      const closeEdit = () => {
        editModal.style.display = 'none';
      };

      closeEditBtn.addEventListener('click', closeEdit);
      cancelEditBtn.addEventListener('click', closeEdit);

      editForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('editVehId').value;
        const updated = {
          name: document.getElementById('editVehName').value.trim(),
          pricePerDay: Number(document.getElementById('editVehPriceDay').value),
          pricePerHour: Number(document.getElementById('editVehPriceHour').value),
          securityDeposit: Number(document.getElementById('editVehDeposit').value),
          mileage: document.getElementById('editVehMileage').value.trim(),
          location: document.getElementById('editVehLocation').value.trim(),
          description: document.getElementById('editVehDesc').value.trim()
        };

        RentroVehicles.update(id, updated);
        RentroUtils.showToast('Vehicle listing updated successfully!', 'success');
        closeEdit();
        loadFleet(searchInput.value.trim());
      });

      // Check URL for ?edit=VEH...
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('edit');
      if (editId) {
        openEditModal(editId);
      }

      loadFleet();
    });
  </script>
</body>
</html>
