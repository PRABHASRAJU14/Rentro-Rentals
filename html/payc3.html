<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../images/logo-badge.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netbanking Payment - Rentro Rentals</title>
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/booking.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  
  <script src="../scripts/utils.js" defer></script>
  <script src="../scripts/storage.js" defer></script>
  <script src="../scripts/auth.js" defer></script>
  <script src="../scripts/payments.js" defer></script>
</head>
<body>

  <header class="rentro-navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon"><img src="../images/logo.png" alt="Rentro Rentals Logo" class="brand-logo-img" /></div>
        <span>Rentro<span class="brand-accent">Rentals</span></span>
      </a>
      <div style="font-size:0.9rem; font-weight:700; color:var(--text-secondary);">
        Internet Banking Portal
      </div>
    </div>
  </header>

  <main class="checkout-step-container">
    <div class="container container-narrow">
      <div class="checkout-card" style="max-width: 600px; margin: 0 auto;">
        <div class="checkout-header">
          <div>
            <h1>Select Your Bank</h1>
            <p style="color:var(--text-muted); font-size:0.85rem;">All major Indian retail & corporate banks supported</p>
          </div>
          <span style="font-size: 1.5rem; font-weight: 800; color:var(--secondary);" id="payc3Amount">₹0</span>
        </div>

        <form id="netbankingForm">
          <div class="form-group">
            <label class="form-label" for="popularBank">Popular Banks</label>
            <div class="bank-selection-grid">
              <button type="button" class="bank-option-btn selected" data-bank="State Bank of India">SBI</button>
              <button type="button" class="bank-option-btn" data-bank="HDFC Bank">HDFC Bank</button>
              <button type="button" class="bank-option-btn" data-bank="ICICI Bank">ICICI Bank</button>
              <button type="button" class="bank-option-btn" data-bank="Axis Bank">Axis Bank</button>
              <button type="button" class="bank-option-btn" data-bank="Kotak Mahindra Bank">Kotak</button>
              <button type="button" class="bank-option-btn" data-bank="Punjab National Bank">PNB</button>
            </div>
          </div>

          <div class="form-group" style="margin-top:20px;">
            <label class="form-label" for="allBanksDropdown">Or Choose from All Banks</label>
            <select id="allBanksDropdown" class="form-control">
              <option value="">-- Select Bank --</option>
              <option value="Bank of Baroda">Bank of Baroda</option>
              <option value="Canara Bank">Canara Bank</option>
              <option value="Union Bank of India">Union Bank of India</option>
              <option value="IndusInd Bank">IndusInd Bank</option>
              <option value="Federal Bank">Federal Bank</option>
              <option value="Yes Bank">Yes Bank</option>
              <option value="IDFC FIRST Bank">IDFC FIRST Bank</option>
            </select>
          </div>

          <div style="background:var(--bg-subtle); padding:16px; border-radius:var(--radius-md); font-size:0.85rem; color:var(--text-secondary); margin: 20px 0;">
            🔒 You will be directed to your bank's secure netbanking authorization server. Keep your customer ID and transaction password handy.
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center;">
            <a href="payment.html" class="btn btn-secondary">&larr; Back</a>
            <button type="submit" class="btn btn-primary btn-lg">Proceed to Bank Authorization &rarr;</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RentroStorage.init();
      const draft = RentroPayments.getCheckoutDraft();
      if (!draft) {
        window.location.href = 'search.html';
        return;
      }

      document.getElementById('payc3Amount').textContent = RentroUtils.formatCurrency(draft.totalAmount);

      let selectedBank = 'State Bank of India';
      const bankButtons = document.querySelectorAll('.bank-option-btn');
      const allBanksDropdown = document.getElementById('allBanksDropdown');

      bankButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          bankButtons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedBank = btn.getAttribute('data-bank');
          allBanksDropdown.value = '';
        });
      });

      allBanksDropdown.addEventListener('change', (e) => {
        if (e.target.value) {
          bankButtons.forEach(b => b.classList.remove('selected'));
          selectedBank = e.target.value;
        }
      });

      document.getElementById('netbankingForm').addEventListener('submit', (e) => {
        e.preventDefault();
        RentroPayments.generateOTP();
        draft.paymentMethod = `Netbanking (${selectedBank})`;
        RentroPayments.saveCheckoutDraft(draft);

        RentroUtils.showToast(`Connecting to ${selectedBank}...`, 'info');
        setTimeout(() => window.location.href = 'otp.html', 500);
      });
    });
  </script>
</body>
</html>
